<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขายดิMarket - ตลาดสิ่งมีชีวิต</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1D4ED8',   
                        secondary: '#2563EB', 
                        accent: '#E11D48',    
                        fbbg: '#F8FAFC',
                    },
                    boxShadow: {
                        'modern': '0 10px 30px -5px rgba(0, 0, 0, 0.05)',
                        'glow': '0 4px 20px -5px rgba(37, 99, 235, 0.3)'
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-fbbg text-slate-800 font-sans antialiased" x-data="marketplaceApp()">

    <!-- 🌐 Header / แถบบนสุด (ช่องค้นหา + ตะกร้า/แชท) -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between space-x-3">
            <!-- ช่องค้นหา -->
            <div class="flex-1 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">🔍</span>
                <input type="text" x-model="searchQuery" placeholder="ค้นหาสินค้า, ชื่อร้าน, หรือสิ่งมีชีวิต..." 
                       class="w-full bg-slate-100 border-2 border-transparent focus:border-primary focus:bg-white rounded-full pl-11 pr-4 py-2 text-sm outline-none transition font-medium">
            </div>

            <!-- ปุ่มทางลัดมุมขวา (แชท/ตะกร้า/เมนูผู้ขาย) -->
            <div class="flex items-center space-x-2">
                <button @click="currentTab = 'home'" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-full relative transition" title="ตะกร้าสินค้า">
                    🛒 <span class="absolute -top-1 -right-1 bg-accent text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button @click="currentTab = 'home'" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-full relative transition" title="ข้อความ">
                    💬 <span class="absolute -top-1 -right-1 bg-secondary text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">1</span>
                </button>
                
                <template x-if="!currentUser">
                    <button @click="showLoginModal = true" class="bg-primary text-white px-4 py-2 rounded-full text-xs font-bold shadow-glow hover:bg-blue-700 transition">
                        เข้าสู่ระบบ
                    </button>
                </template>
                <template x-if="currentUser">
                    <button @click="logout()" class="bg-slate-200 hover:bg-red-100 hover:text-red-600 text-slate-700 px-3 py-2 rounded-full text-xs font-bold transition">
                        ออก
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- 📢 ประกาศเตือนภัย -->
    <div class="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs py-2 text-center font-bold">
        ⚠️ คำแนะนำสำหรับผู้ซื้อ: โปรดตรวจสอบชื่อบัญชีธนาคารให้ตรงกับชื่อผู้ขายก่อนโอนเงินทุกครั้ง
    </div>

    <!-- 📦 Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

        <!-- 1. หน้าแรก (Home) -->
        <div x-show="currentTab === 'home'" class="space-y-6" x-transition>
            
            <!-- ช่องกรองข้อมูล (Filters: ราคา, เรียงลำดับ) -->
            <div class="bg-white p-4 rounded-2xl shadow-modern border border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="text-xs font-bold text-slate-500">⚙️ ตัวกรองข้อมูลพิเศษ:</div>
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <select x-model="sortBy" class="bg-slate-100 border-none rounded-xl px-3 py-2 text-xs font-bold text-slate-700 outline-none flex-1">
                        <option value="latest">⏱️ ลงล่าสุด</option>
                        <option value="price-low">💵 ราคา: น้อยไปมาก</option>
                        <option value="price-high">📈 ราคา: มากไปน้อย</option>
                    </select>
                </div>
            </div>

            <!-- หมวดหมู่ / ประเภท (Categories) -->
            <div class="bg-white p-5 rounded-3xl shadow-modern border border-slate-100">
                <h2 class="text-sm font-extrabold text-slate-800 mb-3">📂 หมวดหมู่สินค้า</h2>
                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2.5">
                    <button @click="selectedCategory = 'all'" 
                            class="p-3 rounded-2xl font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-2"
                            :class="selectedCategory === 'all' ? 'bg-blue-50 border-primary text-primary shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-600 hover:bg-slate-100'">
                        <span class="text-xl">🌟</span>
                        <span>ทั้งหมด</span>
                    </button>
                    <button @click="selectedCategory = 'สัตว์น้ำ'" 
                            class="p-3 rounded-2xl font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-2"
                            :class="selectedCategory === 'สัตว์น้ำ' ? 'bg-blue-50 border-primary text-primary shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-600 hover:bg-slate-100'">
                        <span class="text-xl">🐟</span>
                        <span>สัตว์น้ำ</span>
                    </button>
                    <button @click="selectedCategory = 'สัตว์บก'" 
                            class="p-3 rounded-2xl font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-2"
                            :class="selectedCategory === 'สัตว์บก' ? 'bg-blue-50 border-primary text-primary shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-600 hover:bg-slate-100'">
                        <span class="text-xl">🐅</span>
                        <span>สัตว์บก</span>
                    </button>
                    <button @click="selectedCategory = 'สัตว์ปีก'" 
                            class="p-3 rounded-2xl font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-2"
                            :class="selectedCategory === 'สัตว์ปีก' ? 'bg-blue-50 border-primary text-primary shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-600 hover:bg-slate-100'">
                        <span class="text-xl">🐓</span>
                        <span>สัตว์ปีก</span>
                    </button>
                    <button @click="selectedCategory = 'อุปกรณ์'" 
                            class="p-3 rounded-2xl font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-2"
                            :class="selectedCategory === 'อุปกรณ์' ? 'bg-blue-50 border-primary text-primary shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-600 hover:bg-slate-100'">
                        <span class="text-xl">⚙️</span>
                        <span>อุปกรณ์</span>
                    </button>
                    <button @click="selectedCategory = 'ของตกแต่ง'" 
                            class="p-3 rounded-2xl font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-2"
                            :class="selectedCategory === 'ของตกแต่ง' ? 'bg-blue-50 border-primary text-primary shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-600 hover:bg-slate-100'">
                        <span class="text-xl">🪵</span>
                        <span>ของตกแต่ง</span>
                    </button>
                </div>
            </div>

            <!-- ปุ่มทางลัดขนาดใหญ่: ลงโพสต์ & รวมช่อง Live -->
            <div class="grid grid-cols-2 gap-4">
                <button @click="checkVendorAndPost()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white p-5 rounded-3xl shadow-modern flex flex-col items-center justify-center space-y-1 transition transform hover:-translate-y-0.5">
                    <span class="text-3xl">➕</span>
                    <span class="font-extrabold text-sm sm:text-base">ลงโพสต์ขายสินค้า</span>
                </button>
                <button @click="showAlert('ระบบรวมช่อง Live กำลังพัฒนาเร็วๆ นี้!')" class="bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white p-5 rounded-3xl shadow-modern flex flex-col items-center justify-center space-y-1 transition transform hover:-translate-y-0.5">
                    <span class="text-3xl">🔴</span>
                    <span class="font-extrabold text-sm sm:text-base">รวมช่อง Live สด</span>
                </button>
            </div>

            <!-- ปุ่มทางเข้าแอดมิน (ถ้าล็อกอินเป็นแอดมิน) -->
            <template x-if="userRole === 'admin'">
                <div class="bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center shadow-modern">
                    <span class="text-xs font-bold">⚙️ คุณอยู่ในสถานะผู้ดูแลระบบสูงสุด</span>
                    <button @click="currentTab = 'admin-panel'" class="bg-primary px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 transition">เปิดแผงควบคุมแอดมิน</button>
                </div>
            </template>

            <!-- พื้นที่แสดงรายการสินค้าต่างๆ (Product Feed) -->
            <div class="space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-base font-extrabold text-slate-800" x-text="'รายการสินค้า (' + filteredProducts.length + ')'"></
